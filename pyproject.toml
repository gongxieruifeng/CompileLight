[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reduce-token-agent"
version = "0.1.0"
description = "Lightweight local PoC for deterministic reuse and bounded agent reasoning."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.20,<1",
    "fastapi>=0.115,<1",
    "gradio>=5.20,<7",
    "httpx>=0.27,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=2.0,<4",
    "numpy>=2.0,<3",
    "ollama>=0.4,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "PyYAML>=6.0,<7",
    "structlog>=24.4,<27",
    "tenacity>=9.0,<10",
    "typer>=0.15,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6.0,<8",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
    "types-PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["reduce_token_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
exclude = [".conda", ".mypy_cache", ".pytest_cache", ".ruff_cache"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["reduce_token_agent"]
